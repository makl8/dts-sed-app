---
name: Continuous Integration
run-name: ${{ github.workflow }} - ${{ github.actor }} pushed a change to ${{ github.ref_name }}

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |-
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install ".[test]"; fi

      - name: Run tests with pytest
        env:
          DJANGO_SETTINGS_MODULE: learning.settings
        run: |
          if [ -d tests ]; then pytest tests --cov -vv ; fi

  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/python@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DJANGO_SETTINGS_MODULE: learning.settings
          SECRET_KEY: "pylint-only-not-used-at-runtime"
        with:
          flake8_config_path: .flake8
          ruff_config_path: pyproject.toml
