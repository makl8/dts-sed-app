---
name: Continuous Integration
run-name: ${{ github.workflow }} - ${{ github.actor }} pushed a change to ${{ github.ref_name }}

on:  # yamllint disable-line rule:truthy
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

